name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - ci/**
      - feat/**
      - fix/**
      - refactor/**
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 部署目录在 /opt：runner 的 systemd 沙箱无法访问 /home。
  DEPLOY_DIR: /opt/xartifact/x-sage
  # x99 上 3000/3200/5005/8787 已被其他产品占用。
  HOST_PORT: '3001'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Quality gates + tests
        run: ./scripts/ci.sh

      - name: Build SPA
        # SPA 产物是纯 JS/CSS，跨架构一致，构建一次供两个架构复用。
        # 必须在原生 runner 上构建：esbuild 在 QEMU 模拟下确定性 SIGSEGV，
        # 让 buildx 交叉构建跑到 `vite build` 必然失败。
        run: bun run --filter @x-sage/viz build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: viz-dist
          # The build writes to apps/viz/dist; the artifact renames it to
          # viz-dist/ so the Docker build context never picks up a stale
          # working-tree copy (.dockerignore excludes apps/viz/dist).
          path: apps/viz/dist/
          # Fail loudly instead of uploading nothing: the previous `warn`
          # default let a path typo reach the build job as "artifact not found".
          if-no-files-found: error
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download SPA bundle
        uses: actions/download-artifact@v4
        with:
          name: viz-dist
          path: viz-dist/

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=alpha,enable=${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Resolve build version
        id: build-version
        # 构建上下文里没有 .git（.dockerignore 排除），镜像内无法 `git rev-parse`，
        # 版本只能由 CI 算好传入。三个值一路传到 /api/health，供部署断言。
        run: |
          echo "app_version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-version.outputs.app_version }}
            GIT_COMMIT_HASH=${{ steps.build-version.outputs.commit_hash }}
            BUILD_REF=${{ steps.build-version.outputs.build_ref }}
            PREBUILT_VIZ=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    runs-on: self-hosted
    # 兜底超时：self-hosted 排队本身不受此限，但 job 开始后挂死可以被这里终止。
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy to server
        env:
          IMAGE_TAG: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'latest' || 'alpha' }}
        # 服务器上 DEPLOY_DIR 的 docker-compose.yml 必须使用可插值的 image：
        #   image: ghcr.io/xartifact/x-sage:${IMAGE_TAG:-latest}
        # 硬编码标签会让 `docker pull alpha` 成功却仍启动旧镜像，且不报错。
        run: |
          set -euo pipefail
          cd ${{ env.DEPLOY_DIR }}

          echo "Pulling image tag: ${IMAGE_TAG}"
          docker pull ghcr.io/${{ github.repository }}:${IMAGE_TAG}

          echo "Starting services..."
          HOST_PORT=${{ env.HOST_PORT }} IMAGE_TAG="${IMAGE_TAG}" docker compose up -d

          echo "Waiting for service to become healthy..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' x-sage 2>/dev/null || echo "unknown")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
              echo "✗ Container stopped (status: ${CONTAINER_STATUS})"
              docker compose logs x-sage
              exit 1
            fi

            # 容器内探测：始终是 3000 端口，不受宿主映射影响。
            HTTP_CODE=$(docker exec x-sage bun -e "fetch('http://localhost:3000/api/health').then(r=>console.log(r.status)).catch(()=>console.log(0))" 2>/dev/null || echo "0")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Service is healthy (HTTP 200)"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "✗ Health check timed out after ${MAX_RETRIES} attempts (150s)"
              echo "Last HTTP code: ${HTTP_CODE}, container status: ${CONTAINER_STATUS}"
              docker compose logs --tail=50 x-sage
              exit 1
            fi

            echo "  Attempt ${RETRY_COUNT}/${MAX_RETRIES} (HTTP: ${HTTP_CODE}), retrying in 5s..."
            sleep 5
          done

          # 版本断言：200 无法区分「新容器」与「旧容器还在跑」。必须让运行中的
          # 容器报告本次构建的 commit/ref，否则部署视为失败。
          EXPECTED_HASH="${GITHUB_SHA::7}"
          EXPECTED_REF="${GITHUB_REF_NAME}"
          IDENTITY=$(docker exec x-sage bun -e "fetch('http://localhost:3000/api/health').then(r=>r.json()).then(d=>console.log(JSON.stringify({commitHash:d.commitHash??'',buildRef:d.buildRef??''}))).catch(()=>console.log('{}'))" 2>/dev/null || echo '{}')
          DEPLOYED_HASH=$(printf '%s' "${IDENTITY}" | jq -r '.commitHash // ""')
          DEPLOYED_REF=$(printf '%s' "${IDENTITY}" | jq -r '.buildRef // ""')
          echo "Deployed commitHash: '${DEPLOYED_HASH}' (expected '${EXPECTED_HASH}')"
          echo "Deployed buildRef:   '${DEPLOYED_REF}' (expected '${EXPECTED_REF}')"

          if [ "${DEPLOYED_HASH}" != "${EXPECTED_HASH}" ] || [ "${DEPLOYED_REF}" != "${EXPECTED_REF}" ]; then
            echo "✗ Running container does not report this build's identity"
            docker compose logs --tail=50 x-sage
            exit 1
          fi

          echo ""
          docker compose ps
          echo ""
          echo "Cleaning up old images..."
          docker image prune -f
          echo ""
          echo "✓ Deployment completed"

  notify:
    needs: [build, deploy]
    # 通知只发一个 HTTP 请求，必须跑托管 runner：它正是部署失败的告警通道，
    # 与 deploy 共用 self-hosted 会让 runner 离线时告警一并静默。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'latest' || 'alpha' }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK not configured; skipping notification."
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="✅ x-sage 部署成功"; COLOR="65280"
          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            STATUS="⏭️ x-sage 部署跳过"; COLOR="9807270"
          else
            STATUS="❌ x-sage 部署失败"; COLOR="15548997"
          fi

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" --arg color "$COLOR" --arg branch "$REF_NAME" \
            --arg sha "${COMMIT_SHA:0:7}" --arg msg "$(echo "$COMMIT_MSG" | head -1)" \
            --arg actor "$ACTOR" --arg build "$BUILD_RESULT" --arg tag "$IMAGE_TAG" \
            --arg url "$ACTION_URL" \
            '{embeds: [{title: $status, color: ($color|tonumber),
              fields: [
                {name: "分支", value: $branch, inline: true},
                {name: "提交", value: $sha, inline: true},
                {name: "镜像", value: $tag, inline: true},
                {name: "提交信息", value: $msg},
                {name: "构建", value: $build, inline: true},
                {name: "触发者", value: $actor, inline: true}
              ],
              url: $url}]}')

          curl -sf -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$DISCORD_WEBHOOK"
