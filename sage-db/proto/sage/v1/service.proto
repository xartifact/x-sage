// sage-db command protocol, v1.
//
// THE SINGLE AUTHORITY for this slice: Rust structs and TypeScript interfaces are both
// generated from this file. Do not hand-write a DTO model beside it.
//
// Scope is the private database protocol. Full query, upload and administration
// are separate surfaces.
//
// Identity and numeric rules (deliberate, non-default):
//   * kb_uuid is the canonical 32-character lowercase hex form of Types' KbUuid.
//   * Every record id, version, revision and high-water mark is a DECIMAL STRING, never a
//     JSON number: u64/u128 exceed IEEE-754 doubles and would round silently.
//   * No principal, actor, tx_id, created_at or client-supplied payload digest appears in
//     the envelope. Those come from the authenticated server, the executor and the
//     canonical kernel; a client cannot assert them. A declared author belongs only to a
//     submission payload, where it is attribution rather than identity.

syntax = "proto3";

package sage.v1;

// ---------------------------------------------------------------------------
// Shared primitives
// ---------------------------------------------------------------------------

// A record's numeric identity: kind plus id.
//
// `kind` is the wire value of Types' RecordKind. `id` is a canonical decimal string so a
// u128 survives JSON unchanged; a decoder must parse it checked and reject overflow. For
// Term keys the id must fit u32 — that bound is Types' own rule and is enforced by the
// kernel, not repeated here.
//
// IMPORTANT: `kind` identifies the RECORD FAMILY, not a proposal's sub-kind. Every proposal
// key is `RecordKind::Proposal` (wire 7) no matter which proposal it is; the proposal's own
// `ProposalKind` (claim-edit, concept-text, …) is a FIELD OF THE STORED RECORD and is not
// carried in this key. Nothing may dispatch a proposal's family from `key.kind`; see
// `ReviewPayload`, which states the family explicitly for exactly that reason.
message RecordKey {
  uint32 kind = 1;
  string id = 2;
}

// One entry of a request's exact read set: a key pinned at a revision the caller saw.
//
// The set is carried in the caller's order. The transport never sorts, de-duplicates or
// otherwise normalises it: a read set that is not exactly what the operation requires is a
// caller error the kernel reports, not something a proxy may repair.
message RevPair {
  RecordKey key = 1;
  // Canonical decimal nonzero u64: no current record has revision zero.
  string revision = 2;
}

// The durable basis a record or outcome was observed on.
message ViewBasis {
  // Canonical 32-character lowercase hex.
  string kb_uuid = 1;
  // Canonical decimal u64 commit version.
  string version = 2;
  // SHA-256 of the manifest FILE that the root's CURRENT names, lowercase hex.
  string manifest_sha256 = 3;
}

// The exact per-request envelope.
//
// Deliberately absent: principal, actor, tx_id, created_at, payload_digest. Those are
// server/executor/kernel facts. Adding them here would let a client assert identity or
// content it does not hold.
message Envelope {
  // Must be 1. An unknown version is refused, not interpreted leniently.
  uint32 protocol_version = 1;
  // Canonical 32-character lowercase hex of the KB's KbUuid.
  string kb_uuid = 2;
  // Caller-chosen request id; required for every write. Its uniqueness is per principal,
  // established by the server that authenticates the caller.
  string request_id = 3;
  // Optional caller deadline in milliseconds. Positive when present; the server may
  // tighten it but never extends it.
  optional uint64 deadline_ms = 4;
  // The exact read set. Order is significant and preserved.
  repeated RevPair read_set = 5;
  // Optional optimistic-concurrency expectation: the version the caller believes is
  // current. Canonical decimal u64.
  optional string expect_version = 6;
}

// ---------------------------------------------------------------------------
// Operation shapes
// ---------------------------------------------------------------------------

// A claim edit submission. Mirrors the adopted SubmitClaimEdit operation: the subject term,
// the claim being created or edited, the text, and the declared author.
message ClaimEdit {
  RecordKey subject = 1;
  RecordKey claim = 2;
  string text = 3;
  // Attribution, copied verbatim (may be empty). Never treated as an authenticated
  // identity, and never placed in the envelope.
  string declared_author = 4;
}

// A concept's prose as a text submission. `atom` and `body` are proto3 `optional` so that
// "not provided" is distinguishable from "provided and empty": an editor that clears a body
// must be able to say so, and a NUL byte or non-ASCII text is carried unmodified.
message ConceptText {
  RecordKey subject = 1;
  optional string atom = 2;
  optional string body = 3;
  string declared_author = 4;
  // Reason for the proposed text change. Omit to retain the original request format.
  optional string reason = 5;
}

// Propose one authored assertion with both endpoint revisions in the envelope.
message RelationAssert {
  RecordKey from = 1;
  RecordKey target = 2;
  // Canonical RelationId (0 through 6).
  optional uint32 relation = 3;
  // Canonical confidence (0 contested, 1 hypothetical, 2 confirmed).
  optional uint32 confidence = 4;
  uint32 declaration_order = 5;
  string declared_author = 6;
  string reason = 7;
}

// Propose an entirely new Term. The service reserves its key at submission.
message TermCreate {
  string slug = 1;
  string atom = 2;
  string body = 3;
  optional uint32 layer = 4;
  repeated string domains = 5;
  optional uint32 confidence = 6;
  optional uint32 source = 7;
  repeated string triggers = 8;
  string declared_author = 9;
  string reason = 10;
}

// Legacy filename plus the same authored payload as the native relation submission.
message LegacyRelationSubmit {
  RelationAssert edge = 1;
  string filename = 2;
}

// Compatibility relation whose authored target does not have a Term key yet.
// The envelope pins the observed publication and exactly one real source revision.
message LegacyRelationBySlugSubmit {
  RecordKey from = 1;
  string target_slug = 2;
  optional uint32 relation = 3;
  optional uint32 confidence = 4;
  uint32 declaration_order = 5;
  string declared_author = 6;
  string reason = 7;
  string filename = 8;
}

// Compatibility concept proposal. The envelope pins the observed publication.
message LegacyConceptSubmit {
  ConceptText edit = 1;
  string filename = 2;
  // Exactly one comparison basis must be present.
  optional string current_atom = 3;
  optional string public_revision = 4;
}

// One of the supported proposal submission families. The oneof is explicit so the wire shape
// identifies the family instead of a string discriminator a proxy could rewrite.
message SubmitPayload {
  oneof kind {
    ClaimEdit claim_edit = 1;
    ConceptText concept_text = 2;
    RelationAssert relation_assert = 3;
    TermCreate term_create = 4;
    LegacyRelationSubmit legacy_relation = 5;
    LegacyConceptSubmit legacy_concept = 6;
    LegacyRelationBySlugSubmit legacy_relation_by_slug = 7;
  }
}

// The fields every review decision carries, whichever family it belongs to.
//
// Shared so both families cannot drift in meaning; `ReviewPayload` selects the family.
message ReviewDecisionPayload {
  RecordKey proposal = 1;
  // A closed decision domain. An unrecognised value is refused.
  Decision decision = 2;
  string note = 3;
}

message LegacyProposalReview {
  ReviewDecisionPayload action = 1;
  string filename = 2;
  // Present only for a body approval, from the same observed publication.
  optional string public_revision = 3;
}

// A review decision on an existing proposal, with its family stated on the wire.
//
// The family is EXPLICIT rather than inferred. It cannot be inferred from `proposal`: every
// review target is a `RecordKey` of kind `Proposal` (the wire number is always 7) for every
// proposal, while the family is the *stored record's* `ProposalKind` field. Reading that field
// first would mean reading ambiguous current state before the canonical outcome-first lookup —
// and each family hashes a different operation kind (claim-edit op 2, concept-text op 8,
// relation-assert op 11), so
// the digest a retry must be matched against is not knowable without the family.
//
// Selecting the family here makes the operation kind a property of the REQUEST SHAPE. The
// server dispatches on it, each kernel entry point still validates the stored record's own kind
// and performs its own retry, and a client cannot grant itself anything by choosing one.
message ReviewPayload {
  oneof family {
    ReviewDecisionPayload claim_edit = 1;
    ReviewDecisionPayload concept_text = 2;
    ReviewDecisionPayload relation_assert = 3;
    ReviewDecisionPayload term_create = 4;
    LegacyProposalReview legacy_relation = 5;
    LegacyProposalReview legacy_concept = 6;
  }
}

// What a reviewer decided.
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_APPROVE = 1;
  DECISION_REJECT = 2;
}

// A frontier entry's complete state.
//
// Complete, not a patch: the record's after-image is what persists, and a partial update
// would need a merge rule this protocol does not define and must not invent.
message FrontierState {
  // Concepts this entry is about. May be empty: a subjectless entry is valid. Order is the
  // caller's; the kernel requires strictly ascending unique Term keys and refuses anything
  // else rather than sorting.
  repeated RecordKey concept_refs = 1;
  // The entry's prose, exactly as authored. Empty is a genuine empty blob.
  string text = 2;
  // 0 high, 1 medium, 2 low. Out-of-domain is refused.
  uint32 priority = 3;
  // 0 open, 1 resolved.
  uint32 status = 4;
}

// A session checkpoint's complete state.
message SessionCheckpointState {
  RecordKey concept = 1;
  // Ordinal within the concept, from 1.
  uint32 session_no = 2;
  // Serialised session state, exactly as authored; empty is legal.
  string content = 3;
}

// A commit command's typed operation.
//
// Only the adopted and candidate shapes appear here. There is deliberately no variant that
// carries an arbitrary event, a `PreparedTransaction`, or raw operation bytes: such an
// escape would let a client construct persisted state the kernel never admitted.
message CommitPayload {
  oneof kind {
    // Create a new session checkpoint. Identity is allocated by the kernel from the
    // committed high-water mark; the client cannot name it.
    SessionCheckpointState create_session_checkpoint = 1;
    // Revise an existing checkpoint, whose key the caller names.
    ReviseSessionCheckpoint revise_session_checkpoint = 2;
    // Create a new frontier entry; identity allocated by the kernel.
    FrontierState create_frontier = 3;
    // Revise an existing frontier entry.
    ReviseFrontier revise_frontier = 4;
    DirectConceptCreate direct_concept_create = 5;
  }
}

// Commit one active Term and its authored initial assertions in a single transaction.
message DirectConceptCreate {
  // The authenticated service supplies the audit reason and leaves declared_author empty.
  TermCreate term = 1;
  repeated InitialConceptAssertion assertions = 2;
}

message InitialConceptAssertion {
  RecordKey target = 1;
  // Canonical RelationId (0 through 6).
  optional uint32 relation = 2;
  // Canonical confidence (0 contested, 1 hypothetical, 2 confirmed).
  optional uint32 confidence = 3;
}

// A session checkpoint revision.
message ReviseSessionCheckpoint {
  RecordKey checkpoint = 1;
  SessionCheckpointState state = 2;
}

// A frontier entry revision.
message ReviseFrontier {
  RecordKey frontier = 1;
  FrontierState state = 2;
}

// ---------------------------------------------------------------------------
// Requests
// ---------------------------------------------------------------------------

// Establish protocol identity and learn what this deployment actually supports.
message HandshakeRequest {
  Envelope envelope = 1;
}

// What the running service reports about itself.
//
// Populated from actual runtime facts later; the schema's existence is not a claim that any
// method is supported at activation.
message HandshakeResponse {
  // The profile in force, e.g. "formal-v1" or "legacy-v1".
  string profile = 1;
  // The build/source identity the service reports.
  string source_identity = 2;
  // Capabilities the deployment affirms. An absent entry means unsupported, never
  // "probably fine".
  repeated string capabilities = 3;
  Limits limits = 4;
}

// Ceilings the deployment reports. Advisory to a client; the server enforces its own.
message Limits {
  uint64 max_payload_bytes = 1;
  uint64 max_refs = 2;
  // Canonical record-field byte ceiling, not the separate product character policy.
  uint64 max_atom_bytes = 3;
  // Product command admission in UTF-16 code units. Absent means not advertised;
  // a deployment serving concept text supplies its actual business limit.
  optional uint64 max_atom_utf16_units = 4;
}

// Read the current active term and its stored text on one durable database basis.
message ReadTermTextRequest {
  Envelope envelope = 1;
  string slug = 2;
}

message ReadTermTextResponse {
  ViewBasis basis = 1;
  RecordKey key = 2;
  string revision = 3;
  string slug = 4;
  string atom = 5;
  string body = 6;
}

// One active authored outgoing assertion on the same basis as the term.
message TermDocumentAssertion {
  RecordKey key = 1;
  string revision = 2;
  string relation = 3;
  string target_slug = 4;
  string confidence = 5;
  uint32 declaration_order = 6;
}

// Product clients render the document from these stored fields.
// Assertions retain authored direction and declaration order, then assertion id.
message ReadTermDocumentResponse {
  ReadTermTextResponse text = 1;
  uint32 layer = 2;
  repeated string domains = 3;
  string confidence = 4;
  string source = 5;
  repeated string triggers = 6;
  repeated TermDocumentAssertion assertions = 7;
}

// Historical lexical bytes for an unchanged imported term, scoped to its current key.
message ImportedTermSource {
  string bytes_base64 = 1;
  uint64 length = 2;
  string sha256 = 3;
}

// Current term body, with optional source bytes from its committed import package.
message ReadTermActivationResponse {
  ReadTermTextResponse text = 1;
  ImportedTermSource original = 2;
}

message ReadGraphSnapshotRequest {
  Envelope envelope = 1;
}

// Current active term metadata with authored assertions, all on one basis.
// Bodies, retired terms and retracted assertions are excluded.
message ReadGraphSnapshotResponse {
  ViewBasis basis = 1;
  repeated GraphSnapshotTerm terms = 2;
  repeated GraphSnapshotAssertion assertions = 3;
}

message GraphSnapshotTerm {
  string slug = 1;
  string atom = 2;
  uint32 layer = 3;
  repeated string domains = 4;
  string confidence = 5;
  string source = 6;
  repeated string triggers = 7;
  optional string legacy_source_path = 8;
  RecordKey key = 9;
  string revision = 10;
}

message GraphSnapshotAssertion {
  string from_slug = 1;
  string target_slug = 2;
  string relation = 3;
  string confidence = 4;
  uint32 declaration_order = 5;
}

message ReadProposalFilesRequest {
  Envelope envelope = 1;
}

// File-compatible inputs from canonical imported Proposal rows.
message StoredProposalFile {
  string path = 1;
  string status = 2;
  string payload = 3;
  RecordKey key = 4;
  string revision = 5;
}

// Newly submitted compatibility proposals, projected by Bun without Markdown storage.
message NativeProposalFile {
  string directory = 1;
  string filename = 2;
  string status = 3;
  RecordKey key = 4;
  string revision = 5;
  string subject_slug = 6;
  oneof authored {
    NativeProposalEdge edge = 7;
    NativeProposalAtom atom = 8;
    NativeProposalBody body = 9;
  }
}

message NativeProposalEdge {
  string target_slug = 1;
  string relation = 2;
  string confidence = 3;
}

message NativeProposalAtom {
  string current_atom = 1;
  string proposed_atom = 2;
}

message NativeProposalBody {
  string expected_revision = 1;
  string proposed_body = 2;
  string reason = 3;
}

// Unbound documentation only; not a Proposal row.
message ArchivedProposalExample {
  string path = 1;
  string bytes_base64 = 2;
  uint64 length = 3;
  string sha256 = 4;
}

message ReadProposalFilesResponse {
  ViewBasis basis = 1;
  repeated StoredProposalFile files = 2;
  repeated ArchivedProposalExample examples = 3;
  repeated NativeProposalFile native_files = 4;
}

// Submit a proposal for review.
message SubmitProposalRequest {
  Envelope envelope = 1;
  SubmitPayload payload = 2;
}

// The reference a submission produced.
message SubmitCommitted {
  RecordKey proposal = 1;
}

// Decide an existing proposal.
message ReviewProposalRequest {
  Envelope envelope = 1;
  ReviewPayload payload = 2;
}

// The result of an applied review decision.
//
// Carries the proposal's PERSISTED status, never the requested decision: an approval that finds
// a stale baseline commits `PROPOSAL_CONFLICTED`, and reporting the request's intent as the
// result would state something false about stored data.
message ReviewCommitted {
  RecordKey proposal = 1;
  ProposalStatus status = 2;
}

// A proposal's persisted lifecycle state, as stored.
enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_PENDING = 1;
  PROPOSAL_STATUS_APPROVED = 2;
  PROPOSAL_STATUS_REJECTED = 3;
  PROPOSAL_STATUS_CONFLICTED = 4;
}

// Apply one committed command.
message CommitCommandRequest {
  Envelope envelope = 1;
  CommitPayload payload = 2;
}

// One write method's answer.
//
// A thin wrapper rather than a bare `WriteOutcome`, so each method keeps a distinct response
// type for generated-code ergonomics while the outcome vocabulary stays single.
message SubmitProposalResponse {
  WriteOutcome outcome = 1;
}

message ReviewProposalResponse {
  WriteOutcome outcome = 1;
}

message CommitCommandResponse {
  WriteOutcome outcome = 1;
}

// The four outcomes EVERY write method can produce.
//
// One message, used by `SubmitProposalResponse`, `ReviewProposalResponse` and
// `CommitCommandResponse`, because the kernel returns the same `HandleOutcome`/`CommandError`
// shape from all three. A per-method dialect would let one response state an outcome its
// siblings cannot, which is how an invented `commit_version` reaches a caller.
//
// `UNKNOWN` deliberately carries NO version: the attempt may or may not have taken effect, and
// inventing version 0 (or any number) would report knowledge the caller does not have. The
// caller resolves before retrying.
message WriteOutcome {
  oneof outcome {
    Committed committed = 1;
    AlreadyCommitted already_committed = 2;
    // The attempt is ambiguous. Resolve; do not assume either way.
    Unknown unknown = 3;
    // A typed refusal. Separate from the three success/ambiguity outcomes.
    CommandError error = 4;
  }
}

// What a committed transaction recorded, as a durable fact.
//
// ONE body shared by `Committed`, `AlreadyCommitted` and `OutcomeFound`, because all three
// describe the same stored record. A retry after a lost ACK must let the client recover the
// identifiers the first attempt produced — above all the allocated proposal id — and it can
// only do that if the already-committed answer carries the same content as the original.
//
// PRESENCE IS THE OUTER OPTIONAL, NEVER AN EMPTY LIST. A `repeated` field carries no presence
// bit, so an empty `affected` or `counters` means exactly what it says — this commit affected no
// record ordering and advanced no counter — which is a legitimate COMPLETE result. It never means
// "the server did not load the body": absence is `None` on the `optional RecordedCommit` that
// holds this message, and a caller must treat an absent body as unknown, not as an empty commit.
//
// Therefore: when `RecordedCommit` IS present, its arrays are the fully decoded, actual,
// hash-verified result. A server that has not read and verified the result blob omits the whole
// message; it must never send an empty placeholder for content it did not read.
message RecordedCommit {
  // Affected records at their new revisions.
  repeated RevPair affected = 1;
  // Counters this commit advanced, at their new high-water marks.
  repeated Counter counters = 2;
  // Canonical decimal u64 commit version.
  string commit_version = 3;
  // Digest of the recorded outcome, lowercase hex.
  string result_ref = 4;
}

// This attempt reached the durable point.
message Committed {
  // The recorded result, byte-for-byte what a later retry will see.
  RecordedCommit recorded = 1;
  // What this method's success additionally proves. Exactly one applies; a caller reads the
  // variant matching the method it called, and an absent variant means "no method-specific
  // detail", never a defaulted value.
  oneof detail {
    SubmitCommitted submit = 5;
    ReviewCommitted review = 6;
  }
}

// The transaction was already committed; the ORIGINAL stored result is returned.
//
// Deliberately carries the same `RecordedCommit` body as `Committed`, so a client that lost the
// first ACK recovers exactly what it lost: the same affected records (including the allocated
// proposal id), the same counters, the same version. Returning only `result_ref` would leave it
// with a digest and no fetch method.
message AlreadyCommitted {
  // The recorded result of the ORIGINAL commit, not a new one.
  RecordedCommit recorded = 1;
  // The decision the ORIGINAL attempt recorded, when the method can state it.
  //
  // Present only when the stored outcome carries it, and it is the ORIGINAL status from the
  // original revision — never the proposal's *current* status, which a later review may have
  // moved on. Absent means "not known here", never "approved".
  optional ProposalStatus original_status = 2;
}

// The attempt's authority is undecided.
message Unknown {
  // The request id whose attempt is ambiguous. There is deliberately no version field.
  string request_id = 1;
}

// One advanced allocation counter.
message Counter {
  // The allocation space's wire value.
  uint32 space = 1;
  // Canonical decimal u128 high-water mark.
  string hwm = 2;
}

// Look up a previously committed request's outcome.
message GetRequestOutcomeRequest {
  Envelope envelope = 1;
}

// One of the three real lookup results.
//
// There is no empty-response-means-absent path: absence is stated explicitly together with
// the basis it was established on, and an incomplete read is its own variant.
message GetRequestOutcomeResponse {
  oneof result {
    OutcomeFound found = 1;
    OutcomeAbsent absent = 2;
    OutcomeIncomplete incomplete = 3;
    CommandError error = 4;
  }
}

// The request is known on this durable basis.
message OutcomeFound {
  // The ORIGINAL version at which it was first committed.
  string original_version = 1;
  // Digest of the recorded result, lowercase hex.
  string result_ref = 2;
  // The request's own payload digest, lowercase hex.
  string request_digest = 3;
  ViewBasis basis = 4;
  // The recorded result body, served from the committed blob the server hash-verifies.
  //
  // Optional because a lookup may legitimately answer from the outcome index alone, without
  // reading the result blob; absent then means "not loaded", and the client may not treat it as
  // an empty commit.
  optional RecordedCommit recorded = 5;
  // The decision the original attempt recorded, when the stored outcome carries it.
  optional ProposalStatus original_status = 6;
}

// Complete coverage of this durable basis, and no such request.
message OutcomeAbsent {
  ViewBasis basis = 1;
}

// The basis cannot answer definitively.
message OutcomeIncomplete {
  // Which coverage or durability fact is missing.
  string reason = 1;
}

// A typed refusal.
//
// The vocabulary is explicit so a client can branch without parsing text. It preserves the
// classes the kernel and store already distinguish; the optional amounts appear only when
// the refusal actually knows them (a budget refusal knows its unit and figures, a transport
// refusal usually knows nothing).
message CommandError {
  ErrorCode code = 1;
  // Human-readable detail. Never contains secrets, credentials or payload bytes.
  string message = 2;
  // Present only for budget refusals that genuinely report figures.
  BudgetDetail budget = 3;
}

// The closed refusal vocabulary.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_IDEMPOTENCY_MISMATCH = 5;
  ERROR_CODE_BUDGET = 6;
  ERROR_CODE_CANCELLED = 7;
  ERROR_CODE_DEADLINE = 8;
  ERROR_CODE_UNSUPPORTED = 9;
  ERROR_CODE_CORRUPT = 10;
  ERROR_CODE_READ_ONLY = 11;
  ERROR_CODE_COMMIT_UNKNOWN = 12;
  ERROR_CODE_CONCEPT_SLUG_EXISTS = 13;
  ERROR_CODE_LEGACY_PROPOSAL_ATOM_MISMATCH = 14;
  ERROR_CODE_LEGACY_PROPOSAL_BODY_MISMATCH = 15;
  ERROR_CODE_LEGACY_PROPOSAL_TARGET_UNRESOLVED = 16;
}

// Figures a budget refusal genuinely knows.
message BudgetDetail {
  // Which resource ran out.
  BudgetUnit unit = 1;
  // Canonical decimal u64.
  string requested = 2;
  // Canonical decimal u64.
  string remaining = 3;
}

// The two resources a budget refusal can name.
enum BudgetUnit {
  BUDGET_UNIT_UNSPECIFIED = 0;
  BUDGET_UNIT_BYTES = 1;
  BUDGET_UNIT_ENTRIES = 2;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// The command protocol. Five unary methods; no streaming, no upload, no admin surface.
//
// Defining a method here binds it to a wire shape, not to a running implementation: the
// service's ability to answer any of them is a deployment fact reported by Handshake.
service SageCommandService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc ReadTermText(ReadTermTextRequest) returns (ReadTermTextResponse);
  rpc ReadTermDocument(ReadTermTextRequest) returns (ReadTermDocumentResponse);
  rpc ReadTermActivation(ReadTermTextRequest) returns (ReadTermActivationResponse);
  rpc ReadGraphSnapshot(ReadGraphSnapshotRequest) returns (ReadGraphSnapshotResponse);
  rpc ReadProposalFiles(ReadProposalFilesRequest) returns (ReadProposalFilesResponse);
  rpc SubmitProposal(SubmitProposalRequest) returns (SubmitProposalResponse);
  rpc ReviewProposal(ReviewProposalRequest) returns (ReviewProposalResponse);
  rpc CommitCommand(CommitCommandRequest) returns (CommitCommandResponse);
  rpc GetRequestOutcome(GetRequestOutcomeRequest) returns (GetRequestOutcomeResponse);
}
